name: Desktop preview builds
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'packaging/**', 'src/lantern/web/**', '.github/workflows/desktop.yml']
  push:
    branches: [main, feat/public-desktop-app, finish/desktop-release]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" pyinstaller==6.22.3 build
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: python -m build --wheel
      - run: pyinstaller --noconfirm --clean --onefile --name Lantern --collect-data lantern packaging/launcher.py
      - name: Smoke test the executable (Unix)
        if: runner.os != 'Windows'
        run: ./dist/Lantern demo
      - name: Smoke test the executable (Windows)
        if: runner.os == 'Windows'
        run: ./dist/Lantern.exe demo
      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-${{ runner.os }}-${{ runner.arch }}-preview
          path: |
            dist/Lantern*
            dist/*.whl
            README.md
            LICENSE
            docs/DESKTOP.md
